name: Deploy docs to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Cloudflare docs
        run: npm run build:cloudflare

      - name: Prepare Wrangler config
        run: cp wrangler.toml.example wrangler.toml

      - name: Deploy Worker
        run: npx --yes wrangler@4.88.0 deploy --config wrangler.toml
