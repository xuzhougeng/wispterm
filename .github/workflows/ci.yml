name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which jobs need to run from the changed paths. Doc-only changes skip
  # the zig/windows suites; remote-only changes run just the npm job. Required
  # checks gated below report "skipped" (which satisfies branch protection)
  # instead of being filtered out at the `on:` level (which would leave them
  # pending forever and block the merge).
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      remote: ${{ steps.filter.outputs.remote }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` = anything that isn't pure docs/remote. Single negation glob
          # so the `some` quantifier means "some changed file is real code".
          filters: |
            code:
              - '!{docs/**,wiki/**,release-notes/**,plans/**,remote/**,tests/macos_e2e/**,**/*.md,*.md}'
            remote:
              - 'remote/**'

  zig-fast-linux:
    name: Zig fast tests / Linux
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Format check
        run: zig fmt --check build.zig src

      - name: Fetch dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            zig build test --fetch && exit 0
            if [ "$attempt" -lt 5 ]; then
              sleep $((15 * attempt))
            fi
          done
          exit 1

      - name: Fast tests
        run: zig build test

  zig-full-mac-arm:
    name: Zig full tests / macOS ARM
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Fetch dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            zig build test-full -Dtarget=native --fetch && exit 0
            if [ "$attempt" -lt 5 ]; then
              sleep $((15 * attempt))
            fi
          done
          exit 1

      - name: Full tests
        run: zig build test-full -Dtarget=native

      # macOS 12 is best-effort and no hosted runner can run it, so guard the
      # floor statically: fail on an Objective-C API newer than the minimum in
      # build.zig that is not wrapped in @available, and on a release-style
      # .app whose binary minos or Info.plist LSMinimumSystemVersion drifts.
      - name: macOS minimum version checks
        run: zig build check-macos-availability check-macos-minimum -Dtarget=aarch64-macos

  remote-ts:
    name: Remote TypeScript
    needs: changes
    if: ${{ needs.changes.outputs.remote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: remote

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remote/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Production emit: typecheck alone does not validate the Vite client
      # bundle or the tsc server emit (build:docker = build + build:server).
      - run: npm run build:docker

  windows-smoke:
    name: Windows smoke
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: CodeSignTool failure detection
        shell: pwsh
        run: pwsh -NoProfile -File .\packaging\windows\sign-esigner.test.ps1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      # Builds the setup exe from a stub payload, installs it silently into a
      # temp folder, checks the shortcut and Add/Remove Programs entry, then
      # uninstalls silently. No zig build involved.
      - name: Installer silent install and uninstall
        shell: pwsh
        run: pwsh -NoProfile -File .\packaging\windows\installer\installer.test.ps1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Fetch dependencies
        shell: pwsh
        run: |
          foreach ($attempt in 1..5) {
            zig build test --fetch
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 5) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          exit 1

      - name: Fast tests only
        run: zig build test

      # Agent-control loopback round-trip ON Windows. The fast suite above never
      # touches a real socket, and the round-trip test otherwise runs only on
      # non-Windows hosts — which is exactly how the v1.30.0 wisptermctl
      # "malformed response" bug (broken Stream.read on Windows overlapped
      # sockets) reached release. This guards it where it actually bit.
      - name: Agent-control socket round-trip
        run: zig build test-ctl

  windows-shell-integration:
    name: Windows Explorer integration
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          # No Zig cache here. setup-zig saves the global cache in its post
          # step even when the run is cancelled, and a cache saved mid-build
          # carries manifests whose objects were never written. Every later
          # run then restores it and lld-link fails with "could not open
          # .zig-cache\o\...\shell_extension.obj". This job compiles two
          # small C++ files, so a cold libc++/compiler-rt build costs little.
          use-cache: false
      - name: Build COM extension and test driver
        shell: pwsh
        run: |
          # This DLL has no terminal dependencies. Compile it directly so the
          # integration test does not fetch Ghostty's unrelated build graph.
          New-Item -ItemType Directory -Force zig-out\bin | Out-Null
          zig c++ -std=c++17 -DUNICODE -D_UNICODE -shared src/platform/explorer/shell_extension.cpp -lole32 -lshell32 -lshlwapi -luuid -o zig-out/bin/wispterm-shell-extension.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig c++ -std=c++17 -DUNICODE -D_UNICODE src/platform/explorer/shell_extension_test.cpp -lole32 -lshell32 -lshlwapi -luuid -o zig-out/bin/wispterm-shell-extension-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and test identity registration on disposable runner
        timeout-minutes: 8
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=WispTerm CI Test' `
            -KeyUsage DigitalSignature -HashAlgorithm SHA256 -KeyAlgorithm RSA -KeyLength 2048 `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $cerPath = Join-Path $env:RUNNER_TEMP 'wispterm-shell-test.cer'
          try {
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            # AppX deployment and Authenticode use different trust policies.
            # These stores belong only to this disposable CI VM. Machine
            # stores avoid CurrentUser Root's interactive trust confirmation.
            Write-Host 'Preparing disposable VM certificate trust'
            Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
            Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            $env:WISPTERM_WINDOWS_SIGN_THUMBPRINT = $cert.Thumbprint
            Write-Host 'Building and testing signed identity registration'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File debug\test-shell-integration.ps1 -RegisterPackage
            if ($LASTEXITCODE -ne 0) { throw 'Explorer integration tests failed.' }
          } finally {
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\Root\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item $cerPath -ErrorAction SilentlyContinue
          }
